# 全量检查（scripts/check.py）在 Linux 上跑。
#
# 为什么要有 CI：日常开发在 Windows 上，而那边有一批用例被 requires_symlinks 跳过、
# 有些真缺陷只在 Linux 上出现（BrokenPipe 那次）。结果是 check 在 Linux 上从来没绿过，
# 却没人知道。这里补上三个视角：
#
#   py38   真的 Python 3.8 解释器（目标机 NOI Linux 2.0 是 3.8.10）。AST 门禁
#          （agent/tools/check_py38.py）只是尽力而为，对 list[int]、dict | dict
#          这类运行期写法会放行；真解释器上 compileall + 跑测试才算数。
#   latest 最新 Python + 前端构建。
#   root   以 root 跑 Agent 测试：容器里的 CI 通常是 root，安装器测试曾在那种环境下
#          往宿主写 /etc/sudoers.d。这一路守住测试沙箱。
#
# 托管 runner 上的 systemd 不是 NOI Linux 的 245：单元加固 / NNP / 路径单元这类行为
# 由 systemd245 那一路在 Ubuntu 20.04 容器（真 systemd 当 PID 1）里冒烟证明，
# 见 scripts/smoke_systemd245.py。

name: check

on:
  push:
    # 只跑分支（标签由 release.yml 以 workflow_call 调本工作流）。main 只经 PR 从 dev 合入，
    # 内容已在 dev 上检查过，发版时 release.yml 还会对 main 的提交再跑一遍，所以 push 到 main 不跑
    branches: ["**", "!main"]
  # 合入 main 的 PR 只来自 dev，push 那次已经跑过，不再触发 pull_request 运行（PR 上只剩一组检查）。
  # 其余 PR：本仓库分支发起的由 push 覆盖，各 job 用 if 跳过；外部 fork 的 PR 照跑
  pull_request:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # 带上事件名：release.yml 调用本工作流时 ref 也是 main，不带就会和别的运行互相取消
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  SYNCOJ_TEST_JOBS: "4"

jobs:
  py38:
    name: Python 3.8（目标机版本）
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # ubuntu-24.04 的 setup-python 已不再提供 3.8
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: 安装服务端依赖
        run: python -m pip install -e "server[dev]"
      - name: 真 3.8 解释器编译全部代码
        run: python -m compileall -q agent/syncoj_agent agent/packaging agent/run_agent.py agent/tools server/syncoj_server scripts
      # openapi.json 是生成物，只在规范环境（latest 那一路的最新依赖）里对账：
      # 3.8 只能装到较老的 pydantic，生成结果有无害差异（如 additionalProperties）。
      - name: 全量检查（不含前端与 OpenAPI 对账）
        env:
          SYNCOJ_SKIP_OPENAPI_PARITY: "1"
        run: ./scripts/check.sh --skip-web --skip openapi

  latest:
    name: 最新 Python + 前端
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: |
          python -m pip install -e "server[dev]"
          npm ci --prefix web
      - name: 全量检查
        run: ./scripts/check.sh

  root:
    name: 以 root 跑 Agent 测试
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 安装服务端依赖（Agent 测试里有几条要用服务端的签名实现）
        run: python -m pip install -e "server[dev]"
      - name: Agent 测试（root）
        run: sudo -E env "PATH=$PATH" "$(command -v python)" scripts/check.py --only agent-tests
      - name: 宿主系统路径没被碰过
        run: |
          test ! -e /etc/sudoers.d/syncoj-uninstall
          test ! -e /usr/local/lib/syncoj
          test ! -e /usr/lib/syncoj

  systemd245:
    name: systemd 245 冒烟（Ubuntu 20.04 容器）
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: 安装服务端
        run: python -m pip install -e server
      - name: 安装 → 升级（root 管理单元）→ 卸载
        run: python scripts/smoke_systemd245.py
