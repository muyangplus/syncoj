; SyncOJ Agent 配置示例
;
; 复制到 /etc/syncoj/agent.ini 后按考点实际情况修改。
; 格式是 INI 而不是 TOML —— 目标机 NOI Linux 2.0 自带 Python 3.8，
; 而 tomllib 是 Python 3.11 才进标准库的。

[server]
; 服务端地址。生产环境务必用 https，并配好 ca_file
url = https://10.0.0.1:8443
; 校验服务端证书。设为 false 意味着中间人可以直接读走本机凭据，仅用于调试
verify_tls = true
; 自签 CA 证书路径（用自签证书时必填）
ca_file = /etc/syncoj/ca.pem

[agent]
; 统一注册密钥文件（整间机房一份），**root 只读**。
; 这条路径平时用不上 —— 真正干活的是装机时装的 syncoj-agent-enroll.service：
; 它以 root 身份跑一次注册，把凭据交给选手账号，之后 Agent 只读凭据。
; 留在这里是为了：root 直接跑 Agent 时能自己注册，以及排查时能手工触发。
;
; 密钥的**内容**绝不要写进本文件：agent.ini 的属主是选手账号，
; 学生读得到里面的每一个字节，而那把钥匙能注册整间机房。
;
; 也没有 enroll_code（每选手注册码）了 —— 它已经被"机器永久绑定名单条目"
; 取代：注册上来的是"一台还没有归属的机器"，教师再用六位配对码把它绑到人。
bootstrap_key_file = /etc/syncoj/bootstrap.key
; **运行账号**：Agent 以它运行，路径模板里的 {home} / {desktop} 也**只按它**解析。
; 与"当前是谁在跑这个进程"**无关** —— 注册单元以 root 跑（syncoj-agent-enroll.service），
; 若按当前进程的用户解析就会算成 /root/桌面，而那台机器上根本不存在：
; 注册直接失败、退出 2。安装器会把"跑安装的那个账号"写进这一项。
; 留空则退回当前用户（手工部署、自己跑排障时用）。
run_user =
; 状态目录：凭据、哈希缓存、日志、未完成的分片
state_dir = /var/lib/syncoj
; 本机标识。留空则自动读取 /etc/machine-id（推荐留空）
machine_id =
;
; 下发文件的落地根目录。
; {desktop} 会自动探测**运行账号**的桌面 —— 兼容「桌面」与 Desktop 两种命名
; （先看 <运行账号的家>/.config/user-dirs.dirs，再看哪个目录实际存在）。
; 注意不是"当前用户的桌面"：注册单元以 root 跑，按当前进程的用户会算成
; /root/桌面（见上面的 run_user）。
;
; 下发目标由服务端指定（相对本目录）：
;   留空          → 直接落在根目录，如 桌面/题面.pdf
;   {player_no}/<题目名>/  → 桌面/<准考证号>/<题目名>/<文件名>
deploy_root = {desktop}

[pairing]
; 把本机状态写到桌面上给教师看：
;   还没配对到人   -> <桌面>/配对码.txt，里面是六位配对码
;   已配对但没场次 -> <桌面>/等待场次.txt，里面是原因
; 能干活之后这两个文件都会自动消失。
;
; 关掉它的场景只有一种：桌面不可写、或考点规定桌面必须干净。
; 关掉不等于不工作 —— 日志里还有一份，只是要 journalctl 才看得到。
show_on_desktop = true
file_name = 配对码.txt

[scan]
; 要回收的代码目录，绝对路径。多个目录用换行或逗号分隔。
;
; 默认约定（可自由修改这一行）：
;     桌面/<准考证号>/<题目名>/<题目名>.cpp
;
; 可用的占位符 —— 分两类，这个区别很重要：
;
;   载入配置时就展开（按 [agent] run_user 那个账号，**不是**当前进程的用户）：
;     {desktop}       = 运行账号的桌面（自动探测）
;     {home}          = 运行账号的家目录
;
;   注册成功后才展开：
;     {player_no}     = 准考证号
;     {contest_slug}  = 场次标识
;
; 后两个在注册之前**原样保留**，不会报错 —— 配置校验发生在注册之前，
; 把"还没注册"说成"配置错了"只会让人白折腾。注册完成后 Agent 会在启动
; 日志里打出最终展开的目录，对着它核对最快。
;
; 其它写法示例：
;   roots = /home/student/code
;   roots = {home}/我的代码
;   roots = {desktop}/我的代码
;   roots = {desktop}/{contest_slug}/{player_no}      ← 一个考点跑多场次
;   roots = {desktop}/{player_no}, {desktop}/公共
roots = {desktop}/{player_no}
;
; 上报路径的前缀：
;   none = 不加前缀（默认。本机只有一个选手时推荐 —— 扫描根的名字就是准考证号，
;          再加前缀会让 source/ 里准考证号出现两次）
;   auto = 取根目录名。配了多个扫描目录时用它可以区分同名文件
;   其他字面量 = 就用这个字符串（可以含 {player_no} / {contest_slug}）
;
; 注意：前缀会**进到上报路径里**，而服务端是按上报路径把文件归到题目上的。
; 改成 auto 之后路径从 p1/p1.cpp 变成 <准考证号>/p1/p1.cpp，题目的默认
; 代码路径 {ident}/** 就认不出来了 —— 记得同步把题目的「代码路径」改成
; 比如 **/{ident}/**。（题目的「路径试算」可以直接验证。）
prefix = none
; 心跳兜底间隔（秒）。**服务端策略优先**：tick 响应里的 next_tick_seconds
; 与下发的策略都会盖过这里；只有"服务端还没下发策略"时它才生效（默认 30，
; 与服务端的空心跳默认值保持一致）
interval = 30
; 单文件大小上限（字节）。超过则跳过并计入审计事件
max_file_size = 2097152

[log]
; DEBUG / INFO / WARNING / ERROR
level = INFO
; 日志文件路径。留空则写到 <state_dir>/agent.log，自动轮转（4MB × 3）
file =
; 是否同时输出到 stderr（systemd 会收集进 journal）
to_stderr = false

[upgrade]
; 自更新模式：
;   apply = 下载 → 验签 → 原子切换软链并重启（**默认**）
;   stage = 下载、验签、解包到独立目录，但不激活
;   off   = 只上报"有新版本"，什么都不做
;
; 默认 apply：机器铺开之后没人会一台台点升级，安全由签名兜底（没配公钥时
; apply 会直接失败，不会静默升到不明版本）。考场要关就显式写 off ——
; 安装器**不会**悄悄改掉这里已经写死的值（config_policy 默认 keep）。
; Agent 必须装在版本化目录 + current 软链布局下（见 installer），
; 否则 apply 无处可切，会直接失败。
mode = apply
; 安装根目录（installer 创建；手工部署时可留空）
install_root = /opt/syncoj
; 发布签名公钥。留空则任何升级都会被拒绝 —— 没有信任锚的签名毫无意义
public_key =
