; SyncOJ Agent 配置示例
;
; 复制到 /etc/syncoj/agent.ini 后按考点实际情况修改。
; 格式是 INI 而不是 TOML —— 目标机 NOI Linux 2.0 自带 Python 3.8，
; 而 tomllib 是 Python 3.11 才进标准库的。

[server]
; 服务端地址。生产环境务必用 https，并配好 ca_file
url = https://10.0.0.1:8443
; 校验服务端证书。设为 false 意味着中间人可以直接读走本机凭据，仅用于调试
verify_tls = true
; 自签 CA 证书路径（用自签证书时必填）
ca_file = /etc/syncoj/ca.pem

[agent]
; 注册码：教师端签发，首次注册后与本机 machine_id 绑定。
; 机器被快照还原、凭据文件丢失后，靠它自动重新注册，无需人工干预。
enroll_code = XXXX-XXXX-XXXX-XXXX
; 状态目录：凭据、哈希缓存、日志、未完成的分片
state_dir = /var/lib/syncoj
; 本机标识。留空则自动读取 /etc/machine-id（推荐留空）
machine_id =
; 下发文件的落地根目录。服务端只能在这下面写相对路径
deploy_root = /home/student/exam

[scan]
; 要回收的代码目录，绝对路径。多个目录用换行或逗号分隔。
; 多个根目录的**目录名必须互不相同** —— 目录名会作为路径前缀上报
; （例如 code/main.cpp 与 homework/main.cpp），用于区分同名文件。
roots = /home/student/code
; 扫描间隔下限（秒）。实际节奏由服务端 tick 响应动态决定
interval = 60
; 单文件大小上限（字节）。超过则跳过并计入审计事件
max_file_size = 2097152

[log]
; DEBUG / INFO / WARNING / ERROR
level = INFO
; 日志文件路径。留空则写到 <state_dir>/agent.log，自动轮转（4MB × 3）
file =
; 是否同时输出到 stderr（systemd 会收集进 journal）
to_stderr = false
