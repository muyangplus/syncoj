[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syncoj-server"
version = "0.5.0"
description = "SyncOJ 服务端：选手代码回收、文件下发、在线状态与成绩回写"
# PEP 621 的写法：仓库根那份 LICENSE 是全文，这里只声明标识符。许可证是
# Apache-2.0（不是 OSI 之外的变体），所以不写 classifier 也不会被误判。
license = { text = "Apache-2.0" }
authors = [{ name = "muyangplus" }]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.23",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
]

[project.scripts]
syncoj-server = "syncoj_server.cli:main"
syncoj-judge = "syncoj_server.judging.worker:main"

[tool.setuptools.packages.find]
include = ["syncoj_server*"]

# 题目导入时生成 checker 用的模板与随仓库带的 testlib.h（MIT，见 vendor/LICENSE-testlib）
[tool.setuptools.package-data]
"syncoj_server.judging" = ["vendor/*", "checkers/*"]
# 评测机一键安装脚本模板（§12.10）
"syncoj_server.services" = ["judge_install/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows: 只在 Windows 上真跑的用例（winjob 沙箱 + MinGW-w64 g++），其他平台跳过",
]
